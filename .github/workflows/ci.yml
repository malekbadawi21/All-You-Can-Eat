name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches ~/.npm keyed on package-lock.json, so a run that changes no
          # dependencies skips re-downloading them.
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile is out of sync, so CI
      # can't quietly test a different dependency tree than the one committed.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Catches the class of breakage the unit tests can't see — a route that
      # fails to compile, or a bad import in a component.
      - name: Production build
        run: npm run build
